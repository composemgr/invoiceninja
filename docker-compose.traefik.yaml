name: invoiceninja
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: invoiceninja/invoiceninja:latest
    container_name: invoiceninja-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      IS_DOCKER: 'true'
      TRUSTED_PROXIES: '*'
      REQUIRE_HTTPS: 'false'
      APP_DEBUG: '0'
      APP_CIPHER: AES-256-CBC
      DB_USERNAME: ${DB_USER_NAME:-ninja}
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-ninja}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      DB_HOST: invoiceninja-db
      DB_PORT: 3306
      DB_STRICT: 'false'
      DB_TYPE: mysql
      APP_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      IN_USER_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      IN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      MAIL_MAILER: log
      MAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_ENCRYPTION: ${EMAIL_SERVER_USE_TLS:-true}
      MAIL_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      MAIL_FROM_NAME: ${EMAIL_SERVER_FROM_ORG:-InvoiceNinja}
      PDF_GENERATOR: snappdf
      CONTAINER_NAME: invoiceninja-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/invoiceninja:/var/app/public:z'
      - './volumes/data/invoiceninja/storage:/var/app/storage:z'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.app.entrypoints=http'
      - 'traefik.http.routers.app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.app.middlewares=app-https-redirect'
      - 'traefik.http.middlewares.app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.app-secure.entrypoints=https'
      - 'traefik.http.routers.app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.app-secure.service=app'
      - 'traefik.http.services.app.loadbalancer.server.port=9000'
    networks:
      - invoiceninja
      - traefik
  db:
    image: mariadb:latest
    container_name: invoiceninja-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: invoiceninja-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MYSQL_USER: ${DB_USER_NAME:-ninja}
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-ninja}
      MYSQL_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: invoiceninja-db
    volumes:
      - './volumes/db/mariadb/invoiceninja:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - invoiceninja

  redis:
    image: redis:alpine
    container_name: invoiceninja-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: invoiceninja-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: invoiceninja-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoiceninja

networks:
  invoiceninja:
    name: invoiceninja
    external: false
  traefik:
    external: true
